[package]
name = "acgdp"
version = "0.2.0"
edition = "2024"
description = "Recursively extract nested ZIP, 7z, and RAR archives, including disguised image files"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/noctisynth/acgdp"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5.2"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
inquire = "0.9.4"
memchr = "2.8.0"
sevenz-rust2 = { version = "=0.20.2", default-features = false, features = ["aes256", "bzip2", "ppmd", "util"] }
tempfile = "3"
unrar-ng = "0.7.7"
walkdir = "2.5"
zip = { version = "8.6", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate-flate2-zlib-rs", "lzma", "ppmd", "xz", "zstd"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "nested_extraction"
harness = false
